<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie — Flip Hunter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="brand auth-brand">
        <div class="brand-mark">FH</div>
        <div>
            <div class="brand-name">Flip Hunter</div>
            <div class="brand-sub">Control Center V2</div>
        </div>
    </div>
    <h1>Logowanie</h1>
    <p class="muted">Panel zarządzania skanerami, ofertami i flipami.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="post" class="form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label>Login<input name="username" autocomplete="username" required autofocus></label>
        <label>Hasło<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary btn-block" type="submit">Zaloguj</button>
    </form>
</div>
</body>
</html>
