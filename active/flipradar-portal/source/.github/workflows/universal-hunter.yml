name: Universal hunter checks

on:
  push:
    branches: ['feature/**', 'fix/**', main]
  pull_request:

permissions:
  contents: read

jobs:
  hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-universal-test.txt
      - name: Offline business, account and API tests
        run: python -m pytest tests/test_hunter_*.py tests/test_portal_*.py -q
      - name: Universal module style
        run: ruff check --isolated --select E4,E7,E9,F,I universal_v2/hunter universal_v2/portal examples/generate_hunter_demo.py examples/generate_portal_demo.py tests/test_hunter_*.py tests/test_portal_*.py
      - name: Synthetic five-platform smoke test
        run: |
          python -m examples.generate_hunter_demo
          python -m universal_v2.hunter --config runtime/demo/config.json scan
          python -m universal_v2.hunter --config runtime/demo/config.json scan
